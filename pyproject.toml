[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-world"
version = "0.1.0"
description = "2D world sandbox with a tile grid, time control and multiple saves (SQLite)."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-world = "ai_world.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
